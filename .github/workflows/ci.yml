# 오프라인 단위 테스트. 테스트는 합성 데이터와 가짜 저장소 클라이언트만 쓴다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 설치
        run: python -m pip install -e '.[r2,test]'
      - name: 오프라인 단위 테스트
        run: python scripts/run_tests.py
      - name: 다이어그램 근거가 코드와 맞는지 확인
        run: python scripts/check_diagram_claims.py
