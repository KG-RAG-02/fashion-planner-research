services:
  sales-market-review-agent:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    init: true
    restart: unless-stopped
    ports:
      - "8766:8766"
    environment:
      VOGUE_AGENT_SERVICE_BEARER_TOKEN: ${VOGUE_AGENT_SERVICE_BEARER_TOKEN:?VOGUE_AGENT_SERVICE_BEARER_TOKEN is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      VOGUE_HM_RESEARCH_AGGREGATE_R2_KEY: ${VOGUE_HM_RESEARCH_AGGREGATE_R2_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health', timeout=2).read()"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

  sales-market-review-agent-tests:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    network_mode: none
    profiles: ["test"]
    restart: "no"
