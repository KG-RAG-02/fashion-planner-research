services:
  sales-market-review-agent:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      VOGUE_AGENT_SERVICE_BEARER_TOKEN: ${VOGUE_AGENT_SERVICE_BEARER_TOKEN:?VOGUE_AGENT_SERVICE_BEARER_TOKEN is required}
      VOGUE_PROJECT07_DISABLE_DOTENV: "1"
      VOGUE_P07_REVIEW_ARTIFACT_DIR: /data/reviews
      VOGUE_P07_REVIEW_SOURCE: ${VOGUE_P07_REVIEW_SOURCE:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      VOGUE_HM_RESEARCH_AGGREGATE_R2_KEY: ${VOGUE_HM_RESEARCH_AGGREGATE_R2_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # workflow/0.1 requires an upstream artifact mount; the orchestrator's
      # deploy/compose.yaml supplies VOGUE_UPSTREAM_ARTIFACT_ROOT and that mount.
    volumes:
      - review-artifacts:/data/reviews
      - hm-cache:/data/hm-cache

  sales-market-review-agent-tests:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    command: ["python", "scripts/run_tests.py"]
    network_mode: none
    profiles: ["test"]
    restart: "no"

volumes:
  review-artifacts:
  hm-cache:
