services:
  research:
    build:
      context: .
      target: runtime
    image: fashion-planner-research:local
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    environment:
      FASHION_PLANNER_SERVICE_TOKEN: ${FASHION_PLANNER_SERVICE_TOKEN:?FASHION_PLANNER_SERVICE_TOKEN is required}
      RESEARCH_DISABLE_DOTENV: "1"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RESEARCH_AGGREGATE_SNAPSHOT_KEY: ${RESEARCH_AGGREGATE_SNAPSHOT_KEY:-}
      RESEARCH_HM_NONCOMMERCIAL_RESEARCH: ${RESEARCH_HM_NONCOMMERCIAL_RESEARCH:-}
      RESEARCH_TARGET_LLM_TRANSFER_AUTHORIZED: ${RESEARCH_TARGET_LLM_TRANSFER_AUTHORIZED:-}
      RESEARCH_REVIEW_SOURCE: ${RESEARCH_REVIEW_SOURCE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - hm-cache:/data/hm-cache

  research-tests:
    build:
      context: .
      target: test
    image: fashion-planner-research:test
    network_mode: none
    profiles: ["test"]
    restart: "no"

volumes:
  hm-cache:
