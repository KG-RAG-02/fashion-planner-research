services:
  sales-market-review-agent:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    network_mode: none
    init: true
    restart: unless-stopped

  sales-market-review-agent-tests:
    build:
      context: .
    image: vogue-sales-market-review-agent:local
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    network_mode: none
    profiles: ["test"]
    restart: "no"
