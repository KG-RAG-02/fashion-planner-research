[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vogue-sales-market-review-agent"
version = "0.1.0"
description = "Evidence-backed post-planning sales and market review agent for VOGUE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
r2 = ["boto3>=1.35,<2", "duckdb>=1.1,<2"]

[project.scripts]
vogue-sales-market-review-http = "market_research_agent.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]
