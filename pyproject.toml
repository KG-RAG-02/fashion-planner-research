[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vogue-market-research-agent"
version = "0.1.0"
description = "Evidence-aware domain core for the VOGUE Market Research Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vogue-market-research = "market_research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
