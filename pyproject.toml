[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-planner-research"
version = "0.1.0"
description = "Fashion Planner의 판매·시장 검토 서비스"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
r2 = ["boto3>=1.35,<2", "duckdb>=2.0,<3"]

[project.scripts]
fashion-planner-research = "fashion_planner_research.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fashion_planner_research = ["resources/**/*"]
